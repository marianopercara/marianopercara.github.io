<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Esteban Echeverría</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        /* Estilos para etiquetas de texto */
        .leaflet-tooltip {
            font-weight: bold;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Estilo para los marcadores con íconos personalizados (Emojis / Edificios) */
        .custom-icon {
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            font-size: 22px;
            background: white;
            border: 2px solid #333;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1s5EcZf3597cCraFTmZiMXbajYKNEaut19hTKnC-xisI/export?format=csv';

        // 1. PANTALLA DE VISUALIZACIÓN INICIAL (Centro en Monte Grande, Zoom 15)
        const CENTRO_INICIAL = [-34.8182, -58.4670];
        const ZOOM_INICIAL = 15;

        const map = L.map('map').setView(CENTRO_INICIAL, ZOOM_INICIAL);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 2. DEMARCAR UN ÁREA (Rectángulo en el centro de Monte Grande)
        // Definido por las esquinas [Suroeste] y [Noreste]
        const boundsArea = [
            [-34.8230, -58.4730], // Esquina Suroeste
            [-34.8130, -58.4610]  // Esquina Noreste
        ];

        L.rectangle(boundsArea, {
            color: "#d90429",      # Color del borde
            weight: 2,             # Grosor de línea
            fillColor: "#ffb703",  # Color de relleno
            fillOpacity: 0.15,     # Transparencia del área
            dashArray: "5, 5"      # Línea punteada
        }).addTo(map).bindTooltip("Zona Centro Esteban Echeverría", { permanent: false, direction: "center" });

        // Función para limpiar y convertir coordenadas de texto (ej: "-34,8182" a -34.8182)
        function parseCoordinate(val) {
            if (!val) return NaN;
            const cleaned = val.toString().trim().replace(',', '.');
            return parseFloat(cleaned);
        }

        // 3. CARGA Y PROCESAMIENTO DE DATOS
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;

                data.forEach((row, index) => {
                    const latRaw = row.latitud || row.Latitud || row.lat;
                    const lngRaw = row.longitud || row.Longitud || row.lng || row.lon;
                    
                    const lat = parseCoordinate(latRaw);
                    const lng = parseCoordinate(lngRaw);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const nombre = row.nombre || row.Nombre || 'Punto ' + (index + 1);
                        const iconoEmoji = row.icono || row.Icono || '🏛️';
                        const colorPunto = row.color || row.Color || '#007bff';
                        const enlace = row.enlace || row.Enlace || row.url;

                        let marker;

                        // Si es la Municipalidad o tiene un ícono definido, usar ícono con imagen/emoji
                        if (nombre.toLowerCase().includes('municipalidad') || row.icono) {
                            const customIcon = L.divIcon({
                                className: 'custom-icon',
                                html: `<span>${iconoEmoji}</span>`,
                                iconSize: [36, 36],
                                iconAnchor: [18, 18],
                                popupAnchor: [0, -18]
                            });

                            marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                        } else {
                            // Punto circular estándar para los demás sitios
                            marker = L.circleMarker([lat, lng], {
                                radius: 9,
                                fillColor: colorPunto,
                                color: '#ffffff',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map);
                        }

                        // Etiqueta visible al acercarse/pasar
                        marker.bindTooltip(nombre, {
                            permanent: true,
                            direction: 'top',
                            offset: [0, -10]
                        });

                        // Ventana emergente al hacer clic
                        if (enlace) {
                            const popupContent = `
                                <div style="font-family: Arial; text-align: center; padding: 5px;">
                                    <h4 style="margin: 0 0 8px 0; color: #333;">${nombre}</h4>
                                    <a href="${enlace}" target="_blank" style="
                                        display: inline-block;
                                        padding: 6px 12px;
                                        background: #d90429;
                                        color: white;
                                        text-decoration: none;
                                        border-radius: 4px;
                                        font-weight: bold;
                                        font-size: 12px;">
                                        🔗 Abrir Enlace
                                    </a>
                                </div>
                            `;
                            marker.bindPopup(popupContent);
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
