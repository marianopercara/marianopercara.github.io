<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Esteban Echeverría</title>
    
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        /* Estilos para etiquetas de texto persistentes */
        .leaflet-tooltip {
            font-weight: bold;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Estilo para los marcadores con íconos personalizados (Emojis / Edificios) */
        .custom-icon {
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            font-size: 20px;
            background: white;
            border: 2px solid #333;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Librerías de Leaflet y PapaParse -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // URL oficial de exportación CSV de tu Google Sheet
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1s5EcZf3597cCraFTmZiMXbajYKNEaut19hTKnC-xisI/export?format=csv';

        // 1. CONFIGURACIÓN DE PANTALLA INICIAL (Monte Grande, Esteban Echeverría)
        const CENTRO_INICIAL = [-34.8182, -58.4670];
        const ZOOM_INICIAL = 15;

        const map = L.map('map').setView(CENTRO_INICIAL, ZOOM_INICIAL);

        // Capa de mapa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 2. DEMARCACIÓN DE ÁREA (Rectángulo punteado en zona centro)
        const boundsArea = [
            [-34.8230, -58.4730], // Esquina Suroeste
            [-34.8130, -58.4610]  // Esquina Noreste
        ];

        L.rectangle(boundsArea, {
            color: "#d90429",      // Color del borde
            weight: 2,             // Grosor de línea
            fillColor: "#ffb703",  // Color de relleno en versión corregida
            fillOpacity: 0.15,     // Transparencia
            dashArray: "5, 5"      // Línea punteada
        }).addTo(map).bindTooltip("Zona Centro Esteban Echeverría", { permanent: false, direction: "center" });

        // Corrección de comentarios JavaScript
        L.rectangle(boundsArea, {
            color: "#d90429",      // Color del borde
            weight: 2,             // Grosor de línea
            fillColor: "#ffb703",  // Color de relleno
            fillOpacity: 0.15,     // Transparencia del área
            dashArray: "5, 5"      // Línea punteada
        }).addTo(map).bindTooltip("Zona Centro Esteban Echeverría", { permanent: false, direction: "center" });

        // Función global para convertir tanto comas como puntos a float válido
        function parseCoordinate(val) {
            if (val === undefined || val === null) return NaN;
            const cleaned = val.toString().trim().replace(/,/g, '.');
            return parseFloat(cleaned);
        }

        // 3. LECTURA ASINCRÓNICA DE LA PLANILLA Y CREACIÓN DE MARCADORES
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;

                data.forEach((row, index) => {
                    const latRaw = row.latitud || row.Latitud || row.lat;
                    const lngRaw = row.longitud || row.Longitud || row.lng || row.lon;
                    
                    const lat = parseCoordinate(latRaw);
                    const lng = parseCoordinate(lngRaw);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const nombre = row.nombre || row.Nombre || 'Punto ' + (index + 1);
                        const iconoEmoji = row.icono || row.Icono || '🏛️';
                        const colorPunto = row.color || row.Color || '#007bff';
                        const enlace = row.enlace || row.Enlace || row.url || row.URL;

                        let marker;

                        // Marcador especial si es la Municipalidad o si tiene icono especificado
                        if (nombre.toLowerCase().includes('municipalidad') || row.icono || row.Icono) {
                            const customIcon = L.divIcon({
                                className: 'custom-icon',
                                html: `<span>${iconoEmoji}</span>`,
                                iconSize: [34, 34],
                                iconAnchor: [17, 17],
                                popupAnchor: [0, -17]
                            });

                            marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                        } else {
                            // Punto circular estándar de color
                            marker = L.circleMarker([lat, lng], {
                                radius: 9,
                                fillColor: colorPunto,
                                color: '#ffffff',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map);
                        }

                        // Etiqueta permanente flotante sobre el punto
                        marker.bindTooltip(nombre, {
                            permanent: true,
                            direction: 'top',
                            offset: [0, -10]
                        });

                        // Pop-up con hipervínculo
                        if (enlace) {
                            const popupContent = `
                                <div style="font-family: Arial, sans-serif; text-align: center; padding: 4px;">
                                    <h4 style="margin: 0 0 8px 0; color: #333;">${nombre}</h4>
                                    <a href="${enlace}" target="_blank" style="
                                        display: inline-block;
                                        padding: 6px 12px;
                                        background: #d90429;
                                        color: white;
                                        text-decoration: none;
                                        border-radius: 4px;
                                        font-weight: bold;
                                        font-size: 12px;">
                                        🔗 Abrir Enlace
                                    </a>
                                </div>
                            `;
                            marker.bindPopup(popupContent);
                        }
                    }
                });
            },
            error: function(err) {
                console.error("Error al obtener los datos de Google Sheets:", err);
            }
        });
    </script>
</body>
</html>
