<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Esteban Echeverría</title>
    
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        /* Estilos para etiquetas de texto persistentes de los puntos */
        .leaflet-tooltip {
            font-weight: bold;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Marcadores con íconos personalizados */
        .custom-icon {
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            font-size: 20px;
            background: white;
            border: 2px solid #333;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Librerías de Leaflet y PapaParse -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1s5EcZf3597cCraFTmZiMXbajYKNEaut19hTKnC-xisI/export?format=csv';

        const map = L.map('map');

        // Capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 1. POLÍGONOS DE LOCALIDADES
        const zonas = [
            {
                nombre: "9 de Abril",
                coords: [
                    [-34.7550, -58.5250],
                    [-34.7520, -58.5050],
                    [-34.7680, -58.4720],
                    [-34.7820, -58.4600],
                    [-34.7950, -58.4650],
                    [-34.7980, -58.4880],
                    [-34.7900, -58.5150],
                    [-34.7700, -58.5300]
                ],
                fillColor: "#3a86ff"
            },
            {
                nombre: "Luis Guillón",
                coords: [
                    [-34.7680, -58.4720],
                    [-34.7820, -58.4600],
                    [-34.7950, -58.4650],
                    [-34.8050, -58.4550],
                    [-34.8120, -58.4480],
                    [-34.8100, -58.4420],
                    [-34.7880, -58.4380]
                ],
                fillColor: "#8338ec"
            },
            {
                nombre: "Monte Grande",
                coords: [
                    [-34.7900, -58.5150],
                    [-34.7980, -58.4880],
                    [-34.7950, -58.4650],
                    [-34.8050, -58.4550],
                    [-34.8120, -58.4480],
                    [-34.8250, -58.4550],
                    [-34.8380, -58.4620],
                    [-34.8320, -58.4800],
                    [-34.8350, -58.5050]
                ],
                fillColor: "#ff006e"
            },
            {
                nombre: "El Jagüel",
                coords: [
                    [-34.8350, -58.5050],
                    [-34.8320, -58.4800],
                    [-34.8380, -58.4620],
                    [-34.8550, -58.4700],
                    [-34.8680, -58.4750],
                    [-34.8600, -58.4950],
                    [-34.8620, -58.5200],
                    [-34.8480, -58.5100]
                ],
                fillColor: "#fb5607"
            },
            {
                nombre: "Canning (Esteban Echeverría)",
                coords: [
                    [-34.8620, -58.5200],
                    [-34.8600, -58.4950],
                    [-34.8680, -58.4750],
                    [-34.8900, -58.4650],
                    [-34.9100, -58.4700],
                    [-34.9000, -58.5000]
                ],
                fillColor: "#00b4d8"
            }
        ];

        const grupoZonas = L.featureGroup();

        const ESTILO_PERIMETRO = {
            color: "#444444",      // Color gris oscuro suave
            weight: 1.5,           // Grosor fino
            dashArray: "4, 6",     // Línea punteada suave
            opacity: 0.6,          // Transparencia del contorno
            fillOpacity: 0.08      // Fondo muy sutil
        };

        // Renderizado de áreas sin tooltip ni etiquetas en hover
        zonas.forEach(zona => {
            const poligono = L.polygon(zona.coords, {
                ...ESTILO_PERIMETRO,
                fillColor: zona.fillColor
            });

            poligono.addTo(map);
            grupoZonas.addLayer(poligono);
        });

        // 2. ENCUADRE AUTOMÁTICO INICIAL ABARCANDO TODAS LAS LOCALIDADES
        map.fitBounds(grupoZonas.getBounds(), { padding: [15, 15] });

        // Conversión de formato de coordenadas (comas y puntos decimales)
        function parseCoordinate(val) {
            if (val === undefined || val === null) return NaN;
            const cleaned = val.toString().trim().replace(/,/g, '.');
            return parseFloat(cleaned);
        }

        // 3. LECTURA DE GOOGLE SHEETS Y CREACIÓN DE MARCADORES
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;

                data.forEach((row, index) => {
                    const latRaw = row.latitud || row.Latitud || row.lat;
                    const lngRaw = row.longitud || row.Longitud || row.lng || row.lon;
                    
                    const lat = parseCoordinate(latRaw);
                    const lng = parseCoordinate(lngRaw);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const nombre = row.nombre || row.Nombre || 'Punto ' + (index + 1);
                        const iconoEmoji = row.icono || row.Icono || '🏛️';
                        const colorPunto = row.color || row.Color || '#007bff';
                        const enlace = row.enlace || row.Enlace || row.url || row.URL;

                        let marker;

                        if (nombre.toLowerCase().includes('municipalidad') || row.icono || row.Icono) {
                            const customIcon = L.divIcon({
                                className: 'custom-icon',
                                html: `<span>${iconoEmoji}</span>`,
                                iconSize: [34, 34],
                                iconAnchor: [17, 17],
                                popupAnchor: [0, -17]
                            });

                            marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                        } else {
                            marker = L.circleMarker([lat, lng], {
                                radius: 9,
                                fillColor: colorPunto,
                                color: '#ffffff',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map);
                        }

                        marker.bindTooltip(nombre, {
                            permanent: true,
                            direction: 'top',
                            offset: [0, -10]
                        });

                        if (enlace) {
                            const popupContent = `
                                <div style="font-family: Arial, sans-serif; text-align: center; padding: 4px;">
                                    <h4 style="margin: 0 0 8px 0; color: #333;">${nombre}</h4>
                                    <a href="${enlace}" target="_blank" style="
                                        display: inline-block;
                                        padding: 6px 12px;
                                        background: #d90429;
                                        color: white;
                                        text-decoration: none;
                                        border-radius: 4px;
                                        font-weight: bold;
                                        font-size: 12px;">
                                        🔗 Abrir Enlace
                                    </a>
                                </div>
                            `;
                            marker.bindPopup(popupContent);
                        }
                    }
                });
            },
            error: function(err) {
                console.error("Error al obtener los datos de Google Sheets:", err);
            }
        });
    </script>
</body>
</html>
