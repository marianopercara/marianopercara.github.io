<aside class="toc-auto">
  <h4 id="toc-title"></h4>
  <ul id="toc-auto-list"></ul>
</aside>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const toc = document.getElementById("toc-auto-list");
  if (!toc) return;


  const tocTitle = document.getElementById("toc-title");
  const pageTitle = document.querySelector(".page__title");

  if (tocTitle && pageTitle) {

    tocTitle.textContent = pageTitle.textContent.trim();

  }

  
  const headings = document.querySelectorAll(".page__content h2");

  headings.forEach(function(h) {

    if (!h.id) {
      h.id = h.textContent
        .toLowerCase()
        .replace(/[^\w\s-]/g,"")
        .replace(/\s+/g,"-");
    }


    const li = document.createElement("li");
    const a = document.createElement("a");


    a.href = "#" + h.id;
    a.textContent = h.textContent;


    li.appendChild(a);
    toc.appendChild(li);

  });



  const links = toc.querySelectorAll("a");


  const observer = new IntersectionObserver(
    function(entries) {

      entries.forEach(function(entry) {

        if (entry.isIntersecting) {


          links.forEach(function(link) {
            link.classList.remove("active");
          });


          const activeLink = toc.querySelector(
            'a[href="#' + entry.target.id + '"]'
          );


          if (activeLink) {
            activeLink.classList.add("active");
          }

        }

      });

    },
    {
      rootMargin: "-20% 0px -70% 0px"
    }
  );


  headings.forEach(function(h) {
    observer.observe(h);
  });



  const titleObserver = new IntersectionObserver(
    function(entries){

      entries.forEach(function(entry){

        if(entry.isIntersecting){

          tocTitle.style.opacity = "0";

        }
        else{

          tocTitle.style.opacity = "1";

        }

      });

    },
    {
      threshold: 0
    }
  );


  if (tocTitle && pageTitle) {
    titleObserver.observe(pageTitle);
  }


});
</script>
